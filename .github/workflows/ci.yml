name: Harness CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Check formatting
        run: cargo fmt --check

      - name: Run tests
        run: cargo test --workspace

      - name: Check shell scripts
        run: |
          bash -n scripts/install-harness.sh
          bash -n scripts/build-harness-cli-release.sh

      - name: Dry-run installer
        run: |
          tmpdir="$(mktemp -d)"
          scripts/install-harness.sh --dry-run --yes "$tmpdir"
